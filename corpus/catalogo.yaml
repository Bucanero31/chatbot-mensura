vigilancia:
- fuente: Portal RI · Resoluciones
  url: https://ri.gob.do/?page_id=699
  frecuencia: mensual
  detecta: resoluciones nuevas o reemplazadas
- fuente: Portal RI · Disposiciones técnicas DNMC
  url: https://ri.gob.do/?page_id=679
  frecuencia: mensual
  detecta: disposiciones técnicas nuevas
  nota: La fuente de mayor valor operativo para este proyecto.
- fuente: Portal RI · Consulta pública
  url: https://ri.gob.do/?cat=79
  frecuencia: mensual
  detecta: proyectos de disposición antes de entrar en vigencia
  nota: Da semanas de ventaja para preparar los cambios de reglas.
- fuente: Suprema Corte de Justicia
  url: https://poderjudicial.gob.do
  frecuencia: mensual
  detecta: modificaciones a reglamentos por vía jurisdiccional
  nota: LA FUENTE MÁS PELIGROSA. Un cambio aquí (como el de octubre de 2025 sobre la Res. 790-2022) NO
    aparece como resolución nueva en el portal del RI, y el PDF publicado allí puede seguir mostrando
    el texto anterior.
- fuente: Gaceta Oficial / Consultoría Jurídica del Poder Ejecutivo
  url: https://consultoria.gob.do
  frecuencia: mensual
  detecta: modificaciones a la Ley 108-05 y normas conexas
- fuente: CODIA
  url: https://codia.org.do
  frecuencia: mensual
  detecta: circulares y criterios del colegio profesional
- fuente: Artículos de Derogaciones de las normas nuevas
  url: (dentro de cada PDF descargado)
  frecuencia: al incorporar cada norma
  detecta: qué norma vieja queda sin efecto
  nota: El índice de ri.gob.do NO marca las derogadas. La única evidencia fiable es el artículo de Derogaciones
    de la norma nueva. Ver reglas/jerarquia_normativa.yaml.
- fuente: Consejo del Poder Judicial · tasas por servicios
  url: https://poderjudicial.gob.do
  frecuencia: mensual
  detecta: modificaciones a las tasas por servicios de la Jurisdicción Inmobiliaria
  nota: Las tasas no están en el índice de resoluciones del RI. Sin esta tabla el motor no puede validar
    montos, solo la presencia del comprobante.
