  empezar:      {equivalentes: [inicio, iniciar, comienzo]}
  empezo:       {equivalentes: [inicio, iniciar, comienzo]}
  apelar:       {equivalentes: [apelacion, recurso]}
  objetar:      {equivalentes: [objecion, oposicion]}
  corregir:     {equivalentes: [rectificar, rectificacion, correccion, subsanar]}
