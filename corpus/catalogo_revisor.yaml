- id: RES-82-2025
  titulo: Resolución que modifica la Resolución 790-2022 (Reglamento para la Regularización Parcelaria
    y el Deslinde) y deroga el Párrafo II del Art. 54 de la Resolución 787-2022
  anio: 2025
  fecha: 2025-10-09
  emisor: Pleno de la Suprema Corte de Justicia
  estado: vigente
  relevancia: critica
  archivo: vigente/RPJ_resolucion_82_2025.pdf
  minada: 2026-08-26
  nota: 'ES la modificación de la Suprema Corte de octubre de 2025 que el proyecto llevaba meses esperando
    (antiguo pendiente §B). Entra en vigencia el día de su publicación. Modifica los Arts. 5, 6, 8, 9
    y 12 de la RES-790-2022 y deroga el Art. 54 Párr. II de la RES-787-2022. Leída completa: NO toca los
    Arts. 7 ni 13, así que la tolerancia del 5 % de diferencia de área sigue vigente tal como estaba escrita.'
  modifica:
  - norma: RES-790-2022
    articulos:
    - 5
    - 6
    - 8
    - 9
    - 12
  - norma: RES-787-2022
    articulos:
    - 54 Párrafo II (derogado)
