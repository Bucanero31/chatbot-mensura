  url: https://ri.gob.do/wp-content/uploads/Marco_Legal/Resolucion/Resolucion_790-2022.pdf
  modificada_por:
  - norma: RES-82-2025
    fecha: 2025-10-09
    articulos:
    - 5
    - 6
    - 8
    - 9
    - 12
  alerta: 'RESUELTO el 2026-08-26. La modificación de la Suprema Corte de octubre de 2025 es la RES-82-2025,
    ya catalogada y minada. Afecta a los Arts. 5, 6, 8, 9 y 12; los Arts. 7 y 13 quedan intactos. IMPORTANTE:
    el PDF descargado de esta norma es el texto ORIGINAL de 2022 y NO incorpora la modificación. Para
    los artículos modificados manda el texto de la RES-82-2025; para el resto, este PDF.'
